# The main job for flights_project
resources:
  jobs:
    flights_system_test:
      name: flights_system_test_${bundle.target}
      
      permissions:
        - group_name: users
          level: CAN_MANAGE # or CAN_VIEW, CAN_MANAGE
          
      max_concurrent_runs: 1
      
      parameters:
        - name: catalog
          default: main
        - name: database
          default: ${var.flights_test_schema}

      tasks:
        - task_key: notebook_task
          notebook_task:
            notebook_path: ../tests/flights_system_test.ipynb
            base_parameters:
                artifact_path: ${workspace.artifact_path}
          max_retries: 0

